[package]
name = "mailpro-core"
version = "0.3.0"
edition = "2024"
license = "MIT"

[dependencies]
ammonia = "4.2"
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
# 和 async-imap、lettre 用的同一版
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
fastrand = "2"
futures = "0.3"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1-native-tls"] }
# full_encoding：GBK / gb2312 / Big5 等非 UTF-8 字符集，中文邮件常见
mail-parser = { version = "1.0", features = ["full_encoding"] }
percent-encoding = "2"
regex = "1"
rusqlite = { version = "0.41", features = ["bundled", "fallible_uint"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "time", "io-util"] }
tokio-native-tls = "0.3"
tokio-socks = "0.5"
url = "2"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_Security_Cryptography", "Win32_System_Console"] }
