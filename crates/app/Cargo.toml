[package]
name = "mailpro"
version = "0.4.0"
edition = "2024"
license = "MIT"

[dependencies]
mailpro-core = { path = "../core" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures = "0.3"
gpui = { package = "gpui-pre", version = "=0.3.9" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9" }
gpui-component = "=0.7.3"
gpui-kit-assets = "=0.7.3"
raw-window-handle = "0.6"
serde_json = "1"
webview2-com = "0.39"

[dependencies.windows]
version = "0.62"
features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"]
